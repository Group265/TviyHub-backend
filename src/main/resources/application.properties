spring.config.import=optional:file:./.env[.properties]
spring.application.name=TviyHub

spring.datasource.url=jdbc:mysql://localhost:${MYSQL_LOCAL_PORT:3306}/${MYSQL_DATABASE:tviy_hub_db}
spring.datasource.username=${MYSQL_USER:tviyhub_user}
spring.datasource.password=${MYSQL_PASSWORD:tviyhub_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Required: HS256 secret, at least 32 bytes. There is intentionally no default value.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}
app.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Brute-force protection for POST /api/auth/login and /api/auth/register (per client address)
app.rate-limit.max-requests=${RATE_LIMIT_MAX_REQUESTS:20}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
# Temporary lock after consecutive failed logins for the same address and email
app.security.max-login-failures=5
app.security.login-lock-minutes=15

# Email delivery. If MAIL_HOST is empty, codes are only written to the application log (development).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@tviyhub.local}

# One-time email codes
app.verification.code-ttl-minutes=10
app.verification.max-attempts=5
app.verification.resend-cooldown-seconds=60

# Swagger
springdoc.swagger-ui.operation-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

