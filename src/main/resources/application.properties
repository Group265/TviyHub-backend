spring.application.name=TviyHub

spring.datasource.url=jdbc:mysql://localhost:${MYSQL_LOCAL_PORT:3306}/${MYSQL_DATABASE:tviy_hub_db}
spring.datasource.username=${MYSQL_USER:tviyhub_user}
spring.datasource.password=${MYSQL_PASSWORD:tviyhub_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# HS256 secret must be at least 32 bytes; override JWT_SECRET outside local development
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
