databaseChangeLog:
  - changeSet:
      id: create-refresh-tokens-table
      author: tea
      changes:
        - createTable:
            tableName: refresh_tokens
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_refresh_tokens_user
                    referencedTableName: users
                    referencedColumnNames: id
                    deleteCascade: true

              - column:
                  name: token_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_refresh_tokens_token_hash

              - column:
                  name: family_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false

              - column:
                  name: expires_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false

              - column:
                  name: revoked_at
                  type: DATETIME(6)

        - createIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_family
            columns:
              - column:
                  name: family_id

        - createIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_user
            columns:
              - column:
                  name: user_id
