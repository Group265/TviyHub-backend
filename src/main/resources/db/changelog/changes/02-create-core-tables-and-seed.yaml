databaseChangeLog:
  - changeSet:
      id: 2-1-create-resources-table
      author: acidden
      changes:
        - createTable:
            tableName: resources
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

  - changeSet:
      id: 2-2-create-tariffs-table
      author: acidden
      changes:
        - createTable:
            tableName: tariffs
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: resource_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: booking_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

  - changeSet:
      id: 2-3-create-subscriptions-table
      author: acidden
      changes:
        - createTable:
            tableName: subscriptions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: workspace_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_sub_workspace
                    referencedTableName: resources
                    referencedColumnNames: id
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: payment_status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 2-4-create-bookings-table
      author: acidden
      changes:
        - createTable:
            tableName: bookings
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: resource_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_booking_resource
                    referencedTableName: resources
                    referencedColumnNames: id
              - column:
                  name: booking_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: booking_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: start_time
                  type: TIME
              - column:
                  name: end_time
                  type: TIME
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: payment_status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

  - changeSet:
      id: 2-5-create-closed-days-table
      author: acidden
      changes:
        - createTable:
            tableName: closed_days
            columns:
              - column:
                  name: date
                  type: DATE
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

  - changeSet:
      id: 2-6-seed-initial-data
      author: acidden
      changes:
        - insert:
            tableName: resources
            columns:
              - column: { name: name, value: "Робоче місце №1" }
              - column: { name: type, value: "DESK" }
        - insert:
            tableName: resources
            columns:
              - column: { name: name, value: "Робоче місце №2" }
              - column: { name: type, value: "DESK" }
        - insert:
            tableName: resources
            columns:
              - column: { name: name, value: "Робоче місце №3" }
              - column: { name: type, value: "DESK" }
        - insert:
            tableName: resources
            columns:
              - column: { name: name, value: "Робоче місце №4" }
              - column: { name: type, value: "DESK" }
        - insert:
            tableName: resources
            columns:
              - column: { name: name, value: "Робоче місце №5" }
              - column: { name: type, value: "DESK" }
        - insert:
            tableName: resources
            columns:
              - column: { name: name, value: "Робоче місце №6" }
              - column: { name: type, value: "DESK" }
        - insert:
            tableName: resources
            columns:
              - column: { name: name, value: "Переговорна кімната" }
              - column: { name: type, value: "MEETING_ROOM" }

        - insert:
            tableName: tariffs
            columns:
              - column: { name: resource_type, value: "DESK" }
              - column: { name: booking_type, value: "HOURLY" }
              - column: { name: price, value: 150.00 }
        - insert:
            tableName: tariffs
            columns:
              - column: { name: resource_type, value: "DESK" }
              - column: { name: booking_type, value: "DAILY" }
              - column: { name: price, value: 500.00 }
        - insert:
            tableName: tariffs
            columns:
              - column: { name: resource_type, value: "DESK" }
              - column: { name: booking_type, value: "SUBSCRIPTION" }
              - column: { name: price, value: 3500.00 }
        - insert:
            tableName: tariffs
            columns:
              - column: { name: resource_type, value: "MEETING_ROOM" }
              - column: { name: booking_type, value: "HOURLY" }
              - column: { name: price, value: 200.00 }
