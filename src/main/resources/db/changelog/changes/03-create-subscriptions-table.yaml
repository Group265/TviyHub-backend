databaseChangeLog:
  - changeSet:
      id: 3-1-create-subscriptions-table
      author: acidden
      changes:
        - createTable:
            tableName: subscriptions
            ifNotExists: true
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_sub_user
                    referencedTableName: users
                    referencedColumnNames: id
              - column:
                  name: workspace_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_sub_workspace
                    referencedTableName: resources
                    referencedColumnNames: id
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: payment_status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
